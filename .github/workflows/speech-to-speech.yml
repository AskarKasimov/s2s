name: Speech-to-speech deployment checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP test dependencies
        run: python3 -m pip install -c constraints.lock packaging fastapi httpx python-multipart prometheus-client imageio-ffmpeg
      - name: Expose prebuilt ffmpeg binary
        run: |
          if ! command -v ffmpeg >/dev/null; then
            FFMPEG_BIN="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            sudo ln -sf "$FFMPEG_BIN" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Check failure handling without model weights
        run: python3 -m unittest discover -s tests -v
      - name: Check launcher and Docker Compose syntax
        run: |
          bash -n run.sh
          docker compose -f compose.yaml config --quiet
